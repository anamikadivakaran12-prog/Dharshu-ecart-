<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anu Ecart | Online Shopping</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f6f7fb;color:#222}
header{background:#fff;padding:16px 6%;display:flex;align-items:center;
justify-content:space-between;gap:15px;flex-wrap:wrap;box-shadow:0 2px 10px #ddd}
.logo{font-size:27px;font-weight:bold;color:#673de6}
.logo span{color:#ff6b35}
.search{padding:11px;border:1px solid #ddd;border-radius:8px;flex:1;max-width:400px}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 15px;font-weight:bold}
.cart-btn{background:#673de6;color:white}
.hero{margin:25px 6%;padding:45px 7%;border-radius:18px;
background:linear-gradient(120deg,#673de6,#a58bff);color:white}
.hero h1{font-size:clamp(28px,5vw,45px);margin-bottom:15px}
.hero p{margin-bottom:20px;line-height:1.6}
.hero button{background:white;color:#673de6}
main{padding:10px 6% 45px}
.section-title{margin:15px 0 20px;font-size:25px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.categories button{background:white;border:1px solid #ddd}
.categories button.active,.categories button:hover{background:#673de6;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:18px}
.card{background:white;border-radius:13px;padding:13px;box-shadow:0 3px 12px #e8e8ef}
.product-img{height:145px;display:flex;align-items:center;justify-content:center;
background:#f4f1ff;border-radius:10px;font-size:65px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.price{font-weight:bold;color:#673de6;font-size:18px;margin:10px 0}
.card button{background:#673de6;color:white;width:100%}
.heart{float:right;background:#fff!important;color:#e54870!important;width:auto!important;padding:3px!important;font-size:20px}
.cart-panel{display:none;background:white;padding:20px;border-radius:12px;margin:25px 0}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.cart-item button{padding:5px 9px}
footer{text-align:center;padding:25px;background:#202033;color:#fff}
small{color:#777}
@media(max-width:500px){header{padding:14px}.hero{margin:15px;padding:30px 20px}main{padding:10px 15px 30px}.products{gap:10px}.product-img{height:115px;font-size:52px}}
</style>
</head>
<body>

<header>
  <div class="logo">Anu <span>Ecart.</span></div>
  <input class="search" id="search" placeholder="Search products..." oninput="renderProducts()">
  <button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>Discover Your Style!</h1>
  <p>Everything you love, all in one place.<br>
  Shop your favourite products at amazing prices.</p>
  <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Now →</button>
</section>

<main id="shop">
  <h2 class="section-title">Shop by Category</h2>
  <div class="categories" id="categories"></div>

  <h2 class="section-title">Featured Products</h2>
  <div class="products" id="products"></div>

  <section class="cart-panel" id="cartPanel">
    <h2>Your Shopping Cart</h2>
    <div id="cartItems"></div>
    <h3 style="margin:18px 0">Total: ₹<span id="total">0</span></h3>
    <button class="cart-btn" onclick="checkout()">Place Order</button>
    <button onclick="toggleCart()">Continue Shopping</button>
  </section>
</main>

<footer>
  <h3>Anu Ecart</h3>
  <p style="margin:10px">Your favourite shopping destination.</p>
  <small>© 2026 Anu Ecart. All rights reserved.</small>
</footer>

<script>
const products=[
{id:1,name:"Classic T-Shirt",price:499,cat:"Fashion",emoji:"👕"},
{id:2,name:"Stylish Shoes",price:1299,cat:"Fashion",emoji:"👟"},
{id:3,name:"Smart Watch",price:1999,cat:"Electronics",emoji:"⌚"},
{id:4,name:"Wireless Headphones",price:1499,cat:"Electronics",emoji:"🎧"},
{id:5,name:"Travel Backpack",price:899,cat:"Accessories",emoji:"🎒"},
{id:6,name:"Sunglasses",price:399,cat:"Accessories",emoji:"🕶️"},
{id:7,name:"Skin Care Kit",price:699,cat:"Beauty",emoji:"🧴"},
{id:8,name:"Running Shoes",price:1599,cat:"Fashion",emoji:"👟"},
{id:9,name:"Bluetooth Speaker",price:999,cat:"Electronics",emoji:"🔊"},
{id:10,name:"Handbag",price:1199,cat:"Accessories",emoji:"👜"},
{id:11,name:"Perfume",price:799,cat:"Beauty",emoji:"🌸"},
{id:12,name:"Face Cream",price:349,cat:"Beauty",emoji:"🧴"}
];

let cart={};
let category="All";
let wishlist=[];

function renderCategories(){
const cats=["All",...new Set(products.map(p=>p.cat))];
document.getElementById("categories").innerHTML=cats.map(c=>
`<button class="${category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`
).join("");
}

function setCategory(c){category=c;renderCategories();renderProducts()}

function renderProducts(){
const q=document.getElementById("search").value.toLowerCase();
const list=products.filter(p=>(category==="All"||p.cat===category)&&p.name.toLowerCase().includes(q));
document.getElementById("products").innerHTML=list.length?list.map(p=>`
<div class="card">
<div class="product-img">${p.emoji}</div>
<button class="heart" onclick="wish(${p.id})">${wishlist.includes(p.id)?"❤️":"♡"}</button>
<h3>${p.name}</h3><small>${p.cat}</small>
<div class="price">₹${p.price.toLocaleString("en-IN")}</div>
<button onclick="addToCart(${p.id})">Add to Cart +</button>
</div>`).join(""):"<p>No products found.</p>";
}

function wish(id){
if(wishlist.includes(id))wishlist=wishlist.filter(x=>x!==id);
else wishlist.push(id);
renderProducts();
}

function addToCart(id){
cart[id]=(cart[id]||0)+1;
updateCart();
}

function changeQty(id,change){
cart[id]=(cart[id]||0)+change;
if(cart[id]<=0)delete cart[id];
updateCart();
}

function updateCart(){
let count=Object.values(cart).reduce((a,b)=>a+b,0);
let total=0;
document.getElementById("count").textContent=count;
document.getElementById("cartItems").innerHTML=Object.keys(cart).map(id=>{
let p=products.find(x=>x.id==id);
total+=p.price*cart[id];
return `<div class="cart-item">
<div>${p.emoji} ${p.name}<br><small>₹${p.price} each</small></div>
<div>
<button onclick="changeQty(${id},-1)">−</button>
${cart[id]}
<button onclick="changeQty(${id},1)">+</button>
</div>
</div>`;
}).join("")||"<p>Your cart is empty.</p>";
document.getElementById("total").textContent=total.toLocaleString("en-IN");
}

function toggleCart(){
let panel=document.getElementById("cartPanel");
panel.style.display=panel.style.display==="block"?"none":"block";
panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function checkout(){
if(!Object.keys(cart).length){alert("Your cart is empty!");return;}
alert("This is a static demo. Online payment and order processing are not connected.");
}

renderCategories();
renderProducts();
updateCart();
</script>
</body>
</html>
